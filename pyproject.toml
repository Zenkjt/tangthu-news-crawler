[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tangthu-news-crawler"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "scrapy>=2.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
