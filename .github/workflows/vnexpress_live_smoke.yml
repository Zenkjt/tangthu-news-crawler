name: VnExpress Live Smoke Test

on:
  push:
    branches:
      - vnexpress-topic-adapter

permissions:
  contents: read

concurrency:
  group: vnexpress-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke test - ${{ matrix.topic_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - topic_name: goc-nhin
            topic_url: https://vnexpress.net/goc-nhin
          - topic_name: kinh-doanh-quan-tri
            topic_url: https://vnexpress.net/goc-nhin/kinh-doanh-quan-tri
          - topic_name: van-hoa-loi-song
            topic_url: https://vnexpress.net/goc-nhin/van-hoa-loi-song

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run VnExpress live smoke test
        run: |
          python scripts/vnexpress_live_smoke.py \
            --url "${{ matrix.topic_url }}" \
            --max-articles 10 \
            --max-pages 3
