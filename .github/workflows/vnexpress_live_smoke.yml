
name: VnExpress Live Smoke Test

on:
  push:
    branches:
      - vnexpress-topic-adapter

permissions:
  contents: read

concurrency:
  group: vnexpress-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run VnExpress live smoke test
        run: |
          python scripts/vnexpress_live_smoke.py \
            --url "https://vnexpress.net/goc-nhin" \
            --max-articles 5 \
            --max-pages 3
