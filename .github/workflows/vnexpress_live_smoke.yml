name: VnExpress 25 Articles Comparison Test

on:
  push:
    branches:
      - main
    paths:
      - "src/tangthu_crawler/**"
      - "config/sources/vnexpress.yaml"
      - "scripts/vnexpress_live_smoke.py"
      - ".github/workflows/vnexpress_live_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vnexpress-25x2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: 25 articles - ${{ matrix.topic_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - topic_name: goc-nhin
            topic_url: https://vnexpress.net/goc-nhin
          - topic_name: ha-noi
            topic_url: https://vnexpress.net/thoi-su/ha-noi-today

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"

      - name: Discover and extract first 25 articles
        run: |
          python scripts/vnexpress_live_smoke.py \
            --url "${{ matrix.topic_url }}" \
            --max-articles 25 \
            --max-pages 1
