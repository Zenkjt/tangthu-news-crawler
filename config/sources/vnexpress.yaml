id: vnexpress
name: VnExpress
url: https://vnexpress.net
status: active
site_adapter: vnexpress

http:
  headers:
    Referer: https://vnexpress.net/

discovery:
  - html

html:
  strategy: page_articles
  max_articles: 20
  max_pages: 4
  # Listing containers observed across VnExpress topic templates:
  # Góc nhìn: #paging; older Hà Nội DOM: #list-news;
  # current Hà Nội Today DOM: .list-article.
  article_container_selectors:
    - "#paging, #list-news, .list-article"
  article_link_selectors:
    # Góc nhìn uses item-news; current Hà Nội Today uses article-item.
    - "article.item-news h3.title-news a, article.item-news h2.title-news a"
    - "article.article-item h2.title-news a"
  next_page_selectors:
    - 'a[rel~="next"]'
    - ".pagination a.next"
    - "a.btn-next"
  excluded_path_prefixes:
    - /tag/
    - /topic/
    - /search/
    - /tim-kiem/
    - /category/
    - /photo/
    - /podcast/
    - /live/
    - /infographics/
    - /video/
    - /chu-de/
    - /tac-gia/
    - /author/

extractor:
  engine: vnexpress

quality_gate:
  enabled: true
  require_title: true
  min_body_chars: 300
  min_paragraphs: 2
  reject_titles:
    - Untitled
    - Article

policy:
  mode: full_article
