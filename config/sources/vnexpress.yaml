id: vnexpress
name: VnExpress
url: https://vnexpress.net
status: active

# Vietnamese-news architecture: category pages are primary.
# RSS is intentionally not required.
discovery:
  - html

html:
  strategy: category_pagination
  page_url_template: "/{category}-p{page}"
  article_link_selector: ".title-news a"
  pages: 1
  categories:
    - thoi-su
    - du-lich
    - the-gioi
    - kinh-doanh
    - khoa-hoc
    - giai-tri
    - the-thao
    - phap-luat
    - giao-duc
    - suc-khoe
    - doi-song
  max_urls: 300

extractor:
  engine: newspaper4k

policy:
  mode: excerpt
