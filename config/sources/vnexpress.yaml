id: vnexpress
name: VnExpress
url: https://vnexpress.net
status: active

http:
  headers:
    Referer: https://vnexpress.net/

discovery:
  - html

html:
  strategy: page_articles
  max_articles: 20
  article_link_selectors:
    - ".title-news a"
    - "article h3 a"
    - "article h2 a"
    - "article a"
  excluded_path_prefixes:
    - /tag/
    - /topic/
    - /search/
    - /tim-kiem/
    - /category/
    - /photo/
    - /podcast/
    - /live/
    - /infographics/
    - /video/
    - /chu-de/
    - /tac-gia/
    - /author/

extractor:
  engine: vnexpress

quality_gate:
  enabled: true
  require_title: true
  min_body_chars: 300
  min_paragraphs: 2
  reject_titles:
    - Untitled
    - Article

policy:
  mode: full_article
