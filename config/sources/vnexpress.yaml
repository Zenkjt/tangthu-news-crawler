id: vnexpress
name: VnExpress
url: https://vnexpress.net
status: active

http:
  headers:
    Referer: https://vnexpress.net/

discovery:
  - html

html:
  strategy: page_articles
  max_articles: 20
  article_link_selectors:
    - ".title-news a"
    - "article h3 a"
    - "article h2 a"
    - "article a"

extractor:
  engine: vnexpress

policy:
  mode: excerpt
