id: vnexpress
name: VnExpress
url: https://vnexpress.net
status: active
site_adapter: vnexpress

http:
  headers:
    Referer: https://vnexpress.net/

discovery:
  - html

html:
  strategy: page_articles
  max_articles: 20
  max_pages: 4
  # VnExpress pages put "Đọc nhiều" cards outside the real article stream.
  # Scope discovery to the stream container and retain its DOM order.
  article_container_selectors:
    - "#paging"
  article_link_selectors:
    - "article.item-news h3.title-news a, article.item-news h2.title-news a"
  next_page_selectors:
    - 'a[rel~="next"]'
    - ".pagination a.next"
    - "a.btn-next"
  excluded_path_prefixes:
    - /tag/
    - /topic/
    - /search/
    - /tim-kiem/
    - /category/
    - /photo/
    - /podcast/
    - /live/
    - /infographics/
    - /video/
    - /chu-de/
    - /tac-gia/
    - /author/

extractor:
  engine: vnexpress

quality_gate:
  enabled: true
  require_title: true
  min_body_chars: 300
  min_paragraphs: 2
  reject_titles:
    - Untitled
    - Article

policy:
  mode: full_article
