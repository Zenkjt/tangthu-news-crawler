id: vnexpress
name: VnExpress
url: https://vnexpress.net
status: active
site_adapter: generic

http:
  headers:
    Referer: https://vnexpress.net/

discovery:
  - html

html:
  strategy: generic
  max_articles: 20
  min_link_score: 4

extractor:
  engine: vnexpress

quality_gate:
  enabled: true
  require_title: true
  min_body_chars: 300
  min_paragraphs: 2
  reject_titles:
    - Untitled
    - Article

policy:
  mode: full_article
