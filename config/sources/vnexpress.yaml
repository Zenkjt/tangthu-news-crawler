id: vnexpress
name: VnExpress
url: https://vnexpress.net
status: active
site_adapter: vnexpress

http:
  headers:
    Referer: https://vnexpress.net/

discovery:
  - html

html:
  strategy: page_articles
  max_articles: 20
  max_pages: 4
  article_link_selectors:
    - ".title-news a"
    - "h3.title-news a"
    - "h2.title-news a"
    - "article h3 a"
    - "article h2 a"
    - ".item-news .title-news a"
    - ".item-news a[href]"
  next_page_selectors:
    - 'a[rel~="next"]'
    - ".pagination a.next"
    - "a.btn-next"
  excluded_path_prefixes:
    - /tag/
    - /topic/
    - /search/
    - /tim-kiem/
    - /category/
    - /photo/
    - /podcast/
    - /live/
    - /infographics/
    - /video/
    - /chu-de/
    - /tac-gia/
    - /author/

extractor:
  engine: vnexpress

quality_gate:
  enabled: true
  require_title: true
  min_body_chars: 300
  min_paragraphs: 2
  reject_titles:
    - Untitled
    - Article

policy:
  mode: full_article
