id: cnn
name: CNN
url: https://www.cnn.com/
status: active

http:
  headers:
    Referer: https://www.cnn.com/

# HTML-only discovery. No RSS/Atom/sitemap is used here.
discovery:
  - html

html:
  strategy: generic
  max_articles: 20
  min_link_score: 4

extractor:
  engine: newspaper4k

quality_gate:
  enabled: true
  require_title: true
  min_body_chars: 300
  min_paragraphs: 2
  reject_titles:
    - Untitled
    - Article

# CNN is copyrighted. Keep the test edition to an excerpt unless full-text
# redistribution is explicitly permitted/licensed.
policy:
  mode: excerpt
