project: tangthu-news-crawler
timezone: Asia/Ho_Chi_Minh
crawler:
  request_timeout: 20
  concurrency: 1
  download_delay: 2
  autothrottle_start_delay: 2
  autothrottle_max_delay: 10
  autothrottle_target_concurrency: 0.5
  retry_times: 2
storage:
  article_pool: data/article_pool
  article_cache: data/article_cache
  edition_pool: data/edition_pool
  editions: data/editions
news:
  config_url: https://tangthu-news-worker.mienluonngon.workers.dev/news/config
edition:
  title: YOUR NEWS
  time: "07:00"
drive_upload:
  filename: 0neNews.epub
